name: Rotate profile README

on:
  schedule:
    - cron: "*/5 * * * *"   
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick a random template
        run: |
          current=$(cat .current-template 2>/dev/null || echo "none")
          choice=$(ls templates/*.md | grep -v -x "$current" | shuf -n 1)
          cp "$choice" README.md
          echo "$choice" > .current-template
          echo "Now showing: $choice"

      - name: Commit the new README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add README.md .current-template
          git diff --cached --quiet || git commit -m "Rotate README template"
          git push
