name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-nebula.svg?color_snake=#bb9af7&color_dots=#24283b,#3d59a1,#5a7bd8,#7aa2f7,#bb9af7
            dist/snake-amber.svg?color_snake=#ffb000&color_dots=#1a1206,#4d3300,#805500,#b37700,#ffb000
            dist/snake-synthwave.svg?color_snake=#ff2a6d&color_dots=#1a0b2e,#3b1460,#7b2cbf,#c77dff,#05d9e8
            dist/snake-blueprint.svg?color_snake=#4fc3f7&color_dots=#10274f,#1e4a7a,#2f73a8,#4fc3f7,#b3e5fc
            dist/snake-nord.svg?color_snake=#88c0d0&color_dots=#3b4252,#4c566a,#5e81ac,#81a1c1,#88c0d0

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
